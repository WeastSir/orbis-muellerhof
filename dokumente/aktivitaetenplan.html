<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Aktivitätenplan — Orbis Müllerhof</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <style>
    .hidden-badge {
      display: inline-block;
      background: var(--c-brown);
      color: white;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0.3rem 0.8rem;
      margin-bottom: 1rem;
    }
    .doc-hero { max-width: 900px; margin: 0 auto; text-align: center; }
    .actions {
      display: flex; gap: 1rem; justify-content: center;
      flex-wrap: wrap; margin-top: 2rem;
    }
    .btn-action {
      display: inline-flex; align-items: center; gap: 0.7rem;
      padding: 0.95rem 2rem; text-decoration: none;
      font-size: 0.8rem; letter-spacing: 2.5px;
      text-transform: uppercase; font-weight: 600;
      transition: all 0.25s;
      border: 1.5px solid var(--c-brown);
      background: var(--c-brown); color: #fff;
    }
    .btn-action:hover { background: transparent; color: var(--c-brown); }

    /* 1:1 Excel-Rendering als hochauflösendes PNG */
    .excel-preview-wrap {
      background: #fff;
      box-shadow: 0 25px 80px rgba(43,38,32,0.15);
      border: 1px solid var(--c-line);
      overflow: auto;
      max-width: 100%;
      max-height: 90vh;
    }
    .excel-preview-wrap img {
      display: block;
      width: 100%;
      height: auto;
      min-width: 1400px; /* damit der Plan auch auf kleinen Screens scrollbar bleibt */
    }
    @media (max-width: 768px) {
      .excel-preview-wrap img { min-width: 1100px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="nav-wrapper">
      <a href="../index.html" class="logo"><img src="../images/logo.png" alt="Orbis Müllerhof"></a>
      <div style="color: var(--c-muted); font-size: 0.85rem;">
        Geschützter Bereich
      </div>
    </div>
  </header>

  <section style="padding-top: 140px; padding-bottom: 3rem;">
    <div class="container">
      <div class="doc-hero">
        <span class="hidden-badge">QR-Code Zugriff</span>
        <h1 style="margin-bottom: 0.5rem;">Aktivitätenplan</h1>
        <p style="color: var(--c-muted); font-size: 1.05rem;">
          Arbeitsauftrag &amp; Aktivitätenplan — Projekt Orbis Müllerhof, Team&nbsp;5
        </p>
        <div class="actions">
          <a href="../content/dokumente/aktivitaetenplan.xlsx"
             class="btn-action"
             download="Aktivitaetenplan_Orbis_Muellerhof.xlsx">
            ↓ &nbsp; Excel herunterladen
          </a>
        </div>
      </div>
    </div>
  </section>

  <section style="padding-top: 0; padding-bottom: 5rem;">
    <div class="container" style="max-width: 1500px;">
      <div class="excel-preview-wrap">
        <img src="../content/dokumente/aktivitaetenplan-preview.png"
             alt="Aktivitätenplan Orbis Müllerhof"
             loading="eager">
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Orbis Müllerhof · Frick · Team 5 · SHL BWS</p>
      </div>
    </div>
  </footer>

</body>
</html>
